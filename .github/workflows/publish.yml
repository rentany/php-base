name: Publish

# Builds and publishes the PHP 8.5 runtime base image.
#
# Deliberately infrequent. The point of this image is that application deploys consume a base
# that was built and smoke-tested at a moment we chose, rather than resolving packages while a
# deploy is in flight. The monthly run keeps it from going stale by neglect, which is the
# failure mode that produced this repo in the first place.

on:
  workflow_dispatch:
  schedule:
    # 04:00 UTC on the 1st. Early enough to notice and act before anyone deploys.
    - cron: '0 4 1 * *'
  push:
    branches: [trunk]
    paths:
      - 'Dockerfile'
      - '.github/workflows/publish.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Date tag
        id: meta
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # Built locally first so the smoke test runs before anything is published. An image that
      # cannot start php must never reach the registry, because the next deploy would take it.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: candidate
          # No cache. A cached apk layer over a fresh base is exactly the skew this image exists
          # to prevent — both halves must come from the same moment.
          no-cache: true

      - name: Smoke test the candidate
        run: |
          set -euxo pipefail
          docker run --rm candidate php -v
          docker run --rm candidate composer --version
          docker run --rm candidate php -r 'exit(version_compare(PHP_VERSION, "8.5", ">=") ? 0 : 1);'
          docker run --rm candidate nginx -v
          docker run --rm candidate php-fpm --version

      # Only now, once it has proven it runs.
      - name: Publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:php8.5
            ghcr.io/${{ github.repository }}:php8.5-${{ steps.meta.outputs.date }}

      - name: Summary
        run: |
          {
            echo "### Base image published"
            echo
            echo "Rolling tag: \`ghcr.io/${{ github.repository }}:php8.5\`"
            echo "Pinned tag:  \`ghcr.io/${{ github.repository }}:php8.5-${{ steps.meta.outputs.date }}\`"
            echo
            echo "PHP: \`$(docker run --rm candidate php -r 'echo PHP_VERSION;')\`"
            echo
            echo "Consumers use the rolling tag. To roll back a bad base, point the consuming"
            echo "Dockerfile at an older dated tag and redeploy — no run needed."
          } >> "$GITHUB_STEP_SUMMARY"
