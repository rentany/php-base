name: Publish CI image

on:
  workflow_dispatch:
  push:
    branches: [trunk]
    paths:
      - Dockerfile.ci
      - .github/workflows/publish-ci.yml
  schedule:
    - cron: '30 5 1 * *'

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ci
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          load: true
          pull: true
          no-cache: true
          tags: ci-candidate

      - name: Verify CI tools
        run: |
          docker run --rm ci-candidate bash -eu -c '
            php -r '\''exit(PHP_MAJOR_VERSION === 8 && PHP_MINOR_VERSION === 5 ? 0 : 1);'\''
            php -r '\''new PDO("sqlite::memory:");'\''
            php -r '\''$image = new Imagick(); $image->newImage(2, 2, "white");'\''
            node -e '\''if (process.versions.node.split(".")[0] !== "22") process.exit(1);'\''
            composer --version
            npm --version
            gh --version
            shellcheck --version
            tar --version | grep "GNU tar"
            zstd --version
          '

      # Push the tested image itself rather than rebuilding against moving packages.
      - name: Publish tested candidate
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}:ci-php8.5"
          dated="${image}-$(date -u +%Y-%m-%d)-${GITHUB_SHA:0:12}"
          docker tag ci-candidate "$image"
          docker tag ci-candidate "$dated"
          docker push "$image"
          docker push "$dated"
          {
            echo '### Public CI image published'
            echo "$image"
            echo "$dated"
            docker inspect --format '{{index .RepoDigests 0}}' "$image"
          } >> "$GITHUB_STEP_SUMMARY"
